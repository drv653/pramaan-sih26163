name: CI Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Repository & Code Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check required files existence
        run: |
          echo "Checking core repository files..."
          required_files=(
            "index.html"
            "styles.css"
            "app.js"
            "data.js"
            "vercel.json"
            "favicon.svg"
            "og-image.jpg"
            "README.md"
            "LICENSE"
            "SECURITY.md"
            "CONTRIBUTING.md"
            "CODE_OF_CONDUCT.md"
            "CHANGELOG.md"
            "docs/PRD.pdf"
            "docs/architecture.md"
            "docs/assessment-methodology.md"
            "docs/scope-and-ethics.md"
            "docs/roadmap.md"
            "docs/demo-data.md"
          )
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Error: Required file '$file' is missing!"
              exit 1
            fi
            echo "  OK: $file"
          done

      - name: Syntax check JavaScript files
        run: |
          node --check app.js
          node --check data.js
          echo "JavaScript syntax check passed."

      - name: Validate HTML validity (index.html)
        run: |
          # Use Python's built-in html.parser to ensure well-formed HTML5
          python -c "
          import html.parser
          class StrictHTMLParser(html.parser.HTMLParser):
              def error(self, message):
                  raise Exception(message)
          with open('index.html', 'r', encoding='utf-8') as f:
              content = f.read()
          parser = StrictHTMLParser()
          parser.feed(content)
          print('HTML parsed successfully without structural errors.')
          "
          # Run htmlhint via npx for best practices check
          npx --yes htmlhint index.html --rules "tagname-lowercase=true,attr-lowercase=true,attr-value-double-quotes=true,doctype-first=true,tag-pair=true,spec-char-escape=true,id-unique=true"

      - name: Verify documentation and markdown links
        run: |
          # Python script to verify all local file links in markdown documents
          python -c "
          import os, re, sys

          md_files = ['README.md', 'CONTRIBUTING.md', 'SECURITY.md', 'CODE_OF_CONDUCT.md', 'CHANGELOG.md']
          for root, _, files in os.walk('docs'):
              for f in files:
                  if f.endswith('.md'):
                      md_files.append(os.path.join(root, f))

          errors = 0
          for md in md_files:
              if not os.path.exists(md):
                  continue
              with open(md, 'r', encoding='utf-8') as f:
                  text = f.read()
              # Match markdown links: [text](path)
              links = re.findall(r'\[([^\]]+)\]\(([^)]+)\)', text)
              base_dir = os.path.dirname(md)
              for anchor_text, url in links:
                  # Skip external web protocols and anchor-only links
                  if url.startswith(('http://', 'https://', 'mailto:', '#')):
                      continue
                  # Strip anchor from local file path if present
                  clean_target = url.split('#')[0]
                  if not clean_target:
                      continue
                  target_path = os.path.normpath(os.path.join(base_dir, clean_target))
                  if not os.path.exists(target_path):
                      print(f'Broken link in {md}: {url} -> {target_path} not found', file=sys.stderr)
                      errors += 1

          if errors > 0:
              print(f'Total broken local links: {errors}', file=sys.stderr)
              sys.exit(1)
          print('All relative markdown links verified successfully.')
          "
